<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tap Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    margin:0;height:100vh;overflow:hidden;
    background:#0f172a;color:white;
    font-family:system-ui,sans-serif;
  }

  /* ===== MENU ===== */
  #menu{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(135deg,#020617,#0f172a);
    z-index:1000;
    text-align:center;
    padding:20px;
  }
  #menu h1{margin-bottom:10px}
  #menu p{opacity:.8;margin-bottom:20px}
  #menu .note{
    max-width:360px;
    font-size:12px;
    opacity:.6;
    line-height:1.5;
    margin-top:14px;
  }
  #menu button{
    padding:14px 28px;border:none;border-radius:999px;
    background:#22c55e;color:#020617;font-size:16px;
  }

  /* ===== HUD ===== */
  #score{
    position:fixed;top:14px;right:18px;
    font-size:14px;background:rgba(0,0,0,.4);
    padding:6px 12px;border-radius:999px;z-index:5;
  }
  #info{
    position:fixed;top:14px;left:18px;
    font-size:14px;opacity:.8;z-index:5;
  }
  #timer{
    position:fixed;top:48px;left:18px;
    font-size:12px;opacity:.6;z-index:5;
  }
  #best{
    position:fixed;top:48px;right:18px;
    font-size:12px;opacity:.6;z-index:5;
  }

  /* TARGET */
  #target{
    position:absolute;width:120px;
    cursor:pointer;user-select:none;display:none;
    transition:transform .1s;
  }
  #target:active{ transform:scale(.9); }

  /* FLOAT SCORE */
  .float{
    position:absolute;color:#22c55e;font-size:14px;
    pointer-events:none;animation:floatUp .8s ease-out forwards;
  }
  @keyframes floatUp{
    from{opacity:1;transform:translateY(0)}
    to{opacity:0;transform:translateY(-30px)}
  }

  /* FAKE LAG */
  #lag{
    display:none;position:fixed;inset:0;
    background:rgba(2,6,23,.9);z-index:50;
    align-items:center;justify-content:center;flex-direction:column;
  }
  .spinner{
    width:48px;height:48px;border:4px solid #334155;
    border-top-color:#22c55e;border-radius:50%;
    animation:spin 1s linear infinite;margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* BLINK */
  #blink{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:100}

  /* JUMPSCARE */
  #scare{
    display:none;position:fixed;inset:0;background:black;z-index:200;
  }
  #scare img{
    width:100%;height:100%;object-fit:cover;
    animation:shake .08s infinite;
  }
  @keyframes shake{
    0%{transform:translate(0)}
    25%{transform:translate(-10px,6px)}
    50%{transform:translate(10px,-6px)}
    75%{transform:translate(-6px,10px)}
    100%{transform:translate(0)}
  }

  /* FAKE HACK OVERLAY */
  #hack{
    display:none;position:fixed;inset:0;
    z-index:300;pointer-events:none;
    font-family:monospace;color:#00ff9c;
    background:rgba(0,0,0,.35);
  }
  #hackBox{
    position:absolute;left:20px;bottom:20px;right:20px;
    background:rgba(0,0,0,.75);
    padding:14px;border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    animation:glitch .2s infinite;
  }
  @keyframes glitch{
    0%{filter:brightness(1)}
    50%{filter:brightness(1.25) contrast(1.3)}
    100%{filter:brightness(1)}
  }
  #hackText{white-space:pre-line;font-size:13px;line-height:1.45}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <h1>Tap Game</h1>
  <p>Tap the target as fast as you can</p>
  <button onclick="startGame()">Start Game</button>
  <div class="note">
    Hello everyone, this is my first game, I'm still learning how to make games, so I'm sorry if there are still lots of bugs or something, enjoy.
  </div>
</div>

<!-- HUD -->
<div id="info">Tap the target</div>
<div id="timer">Time: 0s</div>
<div id="score">Score: 0</div>
<div id="best">Best: 120</div>

<img id="target" src="https://i.top4top.io/p_3638ppqjx0.png">

<div id="lag">
  <div class="spinner"></div>
  <div style="opacity:.8;font-size:14px">Network unstable… reconnecting</div>
</div>

<div id="blink"></div>

<div id="scare">
  <img src="https://i.top4top.io/p_36381z43h1.png">
</div>

<div id="hack">
  <div id="hackBox">
    <div id="hackText"></div>
  </div>
</div>

<audio id="tapSound" src="https://g.top4top.io/m_36382w4k50.mp3" preload="auto"></audio>
<audio id="scareSound" src="https://a.top4top.io/m_36385nb5b0.mp3" preload="auto"></audio>

<script>
const REDIRECT_URL = "https://cznull.github.io/vsbm";

let taps=0, score=0, locked=false;
let combo=1, lastTap=0, time=0, timerInt;

const target=document.getElementById("target");
const scoreEl=document.getElementById("score");

function rand(min,max){return Math.random()*(max-min)+min;}

function moveTarget(){
  const w=target.offsetWidth,h=target.offsetHeight;
  target.style.left=rand(0,innerWidth-w)+"px";
  target.style.top=rand(0,innerHeight-h)+"px";
}

function playTapSound(){
  const s=document.getElementById("tapSound");
  s.currentTime=0; s.volume=.8; s.play();
}
function playScareSound(){
  const s=document.getElementById("scareSound");
  s.currentTime=0; s.volume=1; s.play();
}

function floatScore(x,y,val){
  const f=document.createElement("div");
  f.className="float";
  f.style.left=x+"px"; f.style.top=y+"px";
  f.textContent="+"+val;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),800);
}

async function blinkShort(){
  const b=document.getElementById("blink");
  b.style.background="black";
  b.style.opacity="1";
  await new Promise(r=>setTimeout(r,250));
  b.style.background="white";
  await new Promise(r=>setTimeout(r,250));
  b.style.opacity="0";
}

function vibratePanic(){
  if(navigator.vibrate){
    navigator.vibrate([200,100,200,100,200,100,200]);
  }
}

function fakeLagThenJump(){
  locked=true;
  document.getElementById("lag").style.display="flex";
  setTimeout(()=>{
    document.getElementById("lag").style.display="none";
    jumpScare();
  },2000);
}

function startHackOverlay(){
  const hack=document.getElementById("hack");
  const text=document.getElementById("hackText");
  hack.style.display="block";

  const fakeIP="103."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255);
  const lines=[
    ">>> Establishing secure connection...",
    ">>> Target IP : "+fakeIP,
    ">>> Region detected : Indonesia",
    ">>> Webcam status : GRANTED",
    ">>> System integrity : COMPROMISED",
    ">>> Uploading user identities...",
    ">>> Transfer completed ✔"
  ];

  let i=0; text.textContent="";
  const it=setInterval(()=>{
    text.textContent+=lines[i]+"\n";
    if(++i>=lines.length)clearInterval(it);
  },450);
}

async function jumpScare(){
  const s=document.getElementById("scare");
  s.style.display="block";
  await blinkShort();
  vibratePanic();
  startHackOverlay();
  playScareSound();
  setTimeout(()=>{window.location.href=REDIRECT_URL;},3000);
}

target.onclick=e=>{
  if(locked)return;
  const now=Date.now();
  combo=(now-lastTap<600)?Math.min(combo+1,5):1;
  lastTap=now;

  taps++;
  const gain=10*combo;
  score+=gain;
  scoreEl.textContent="Score: "+score;
  playTapSound();
  floatScore(e.clientX,e.clientY,gain);
  moveTarget();

  if(taps===3) blinkShort();
  if(taps===7) fakeLagThenJump();
};

function startGame(){
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
  document.getElementById("menu").style.display="none";
  target.style.display="block";
  moveTarget();
  timerInt=setInterval(()=>{document.getElementById("timer").textContent="Time: "+(++time)+"s";},1000);
}

["wheel","touchmove"].forEach(ev=>{
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
});
</script>

</body>
  </html>
