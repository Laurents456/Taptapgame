<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Terminal</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff9c;
      font-family: "Courier New", monospace;
      font-size: 14px;
      overflow: hidden;
    }

    #screen {
      padding: 20px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #reveal {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      z-index: 99;
      padding: 20px;
    }
  </style>
</head>
<body>

<div id="screen"></div>

<div id="reveal">
  😭 GOTCHA BRO <br><br>
  Ini cuma prank 😈<br>
  Gak ada data dikirim / disimpan.<br><br>
  Santai 🤝
</div>

<script>
  const screen = document.getElementById("screen");
  const reveal = document.getElementById("reveal");

  const fakeIP = "103.145.77.21";
  const fakeISP = "PT Telekomunikasi Indonesia";
  const fakeCity = "Jakarta";
  const fakeCountry = "Indonesia";

  const lines = [
    "[ SYSTEM INITIALIZED ]",
    "Connecting to secure node...",
    "Connection established.",
    "",
    "Accessing device information...",
    "✔ Browser fingerprint acquired",
    "✔ Screen resolution matched",
    "✔ Front camera permission: GRANTED",
    "",
    "Tracing IP address...",
    `IP Address      : ${fakeIP}`,
    `ISP             : ${fakeISP}`,
    `Location        : ${fakeCity}, ${fakeCountry}`,
    "",
    "Running facial scan...",
    "✔ Face detected",
    "✔ Expression analysis complete",
    "",
    "Uploading snapshot...",
    "█▒▒▒▒▒▒▒▒▒ 12%",
    "███▒▒▒▒▒▒▒ 36%",
    "██████▒▒▒▒ 67%",
    "██████████ 100%",
    "",
    "⚠ DATA TRANSMISSION COMPLETE ⚠",
    "",
    "Maintaining live connection...",
    "",
    "> awaiting command_ <span class='blink'>█</span>"
  ];

  let index = 0;

  function typeLine() {
    if (index < lines.length) {
      screen.innerHTML += lines[index] + "\n";
      index++;
      setTimeout(typeLine, 400);
    } else {
      setTimeout(() => {
        reveal.style.display = "flex";
      }, 3000);
    }
  }

  typeLine();
</script>

</body>
</html>
