<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Kamera Depan</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    video {
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }
  </style>
</head>
<body>

  <video id="camera" autoplay playsinline></video>

  <script>
    const video = document.getElementById("camera");

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user" // kamera depan
      },
      audio: false
    })
    .then(stream => {
      video.srcObject = stream;
    })
    .catch(err => {
      alert("Kamera gak bisa diakses 😭");
      console.error(err);
    });
  </script>

</body>
</html>
