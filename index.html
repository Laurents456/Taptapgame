<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Hand Filter - Flash Warning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      touch-action: none;
      font-family: sans-serif;
    }
    
    #output_canvas {
      transform: scaleX(-1);
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    .glass-panel {
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* Animasi peringatan flash */
    @keyframes flashText {
      0%, 100% { color: #ff3b30; }
      50% { color: #fff; }
    }
    .flash-warning-text {
      animation: flashText 0.5s infinite;
    }
  </style>
</head>
<body class="relative flex items-center justify-center h-screen w-screen text-white">

  <!-- Video disembunyikan -->
  <video id="input_video" class="hidden" playsinline></video>
  
  <!-- Canvas Utama -->
  <canvas id="output_canvas"></canvas>

  <!-- UI Overlay -->
  <div class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-4 z-10">
    
    <!-- Top Bar -->
    <div class="flex justify-between items-start">
      <div class="glass-panel px-3 py-2 rounded-xl text-xs font-bold shadow-lg flash-warning-text border-red-500">
        ⚠️ FLASH WARNING AKTIF
      </div>
      
      <!-- Tombol Pengaturan -->
      <button id="settings_btn" class="glass-panel px-4 py-2 rounded-xl text-sm font-bold active:scale-95 pointer-events-auto transition-transform flex items-center gap-2">
        ⚙️ Atur Jari
      </button>
    </div>

    <!-- Status Loading -->
    <div id="loading_indicator" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass-panel text-yellow-400 px-6 py-3 rounded-xl font-bold border-yellow-600 animate-pulse shadow-2xl text-center">
      Menghidupkan Kamera & AI...<br>
      <span class="text-xs text-gray-300 font-normal">Menggunakan Mode Performa Tinggi</span>
    </div>
  </div>

  <!-- Menu Pengaturan Jari (Hidden by default) -->
  <div id="settings_modal" class="hidden absolute top-0 left-0 w-full h-full bg-black bg-opacity-80 z-50 flex items-center justify-center p-4">
    <div class="glass-panel p-6 rounded-3xl w-full max-w-sm pointer-events-auto">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">⚙️ Pengaturan Jari</h2>
        <button id="close_settings_btn" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
      </div>

      <div class="space-y-4">
        <!-- Tangan 1 -->
        <div class="bg-gray-800 bg-opacity-50 p-3 rounded-xl">
          <p class="font-semibold text-sm mb-2 text-indigo-300">Tangan Pertama</p>
          <div class="flex gap-2">
            <select id="t1_p1" class="w-1/2 bg-black border border-gray-600 rounded p-2 text-xs">
              <option value="4" selected>Jempol</option>
              <option value="8">Telunjuk</option>
              <option value="12">Tengah</option>
              <option value="16">Manis</option>
              <option value="20">Kelingking</option>
            </select>
            <select id="t1_p2" class="w-1/2 bg-black border border-gray-600 rounded p-2 text-xs">
              <option value="4">Jempol</option>
              <option value="8" selected>Telunjuk</option>
              <option value="12">Tengah</option>
              <option value="16">Manis</option>
              <option value="20">Kelingking</option>
            </select>
          </div>
        </div>

        <!-- Tangan 2 -->
        <div class="bg-gray-800 bg-opacity-50 p-3 rounded-xl">
          <p class="font-semibold text-sm mb-2 text-pink-300">Tangan Kedua</p>
          <div class="flex gap-2">
            <select id="t2_p1" class="w-1/2 bg-black border border-gray-600 rounded p-2 text-xs">
              <option value="4">Jempol</option>
              <option value="8" selected>Telunjuk</option>
              <option value="12">Tengah</option>
              <option value="16">Manis</option>
              <option value="20">Kelingking</option>
            </select>
            <select id="t2_p2" class="w-1/2 bg-black border border-gray-600 rounded p-2 text-xs">
              <option value="4" selected>Jempol</option>
              <option value="8">Telunjuk</option>
              <option value="12">Tengah</option>
              <option value="16">Manis</option>
              <option value="20">Kelingking</option>
            </select>
          </div>
        </div>
      </div>

      <button id="save_settings_btn" class="w-full mt-6 bg-white text-black font-bold py-3 rounded-xl active:scale-95 transition-transform">
        Simpan & Tutup
      </button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d', { alpha: false }); // Optimasi canvas
    const loadingIndicator = document.getElementById('loading_indicator');
    
    // UI Elements
    const settingsModal = document.getElementById('settings_modal');
    const settingsBtn = document.getElementById('settings_btn');
    const closeSettingsBtn = document.getElementById('close_settings_btn');
    const saveSettingsBtn = document.getElementById('save_settings_btn');

    // Variabel Konfigurasi Jari (Default: Jempol dan Telunjuk)
    // 4=Jempol, 8=Telunjuk, 12=Tengah, 16=Manis, 20=Kelingking
    let fingerConfig = {
      t1_p1: 4, t1_p2: 8,
      t2_p1: 8, t2_p2: 4
    };

    // Array efek flash warning (berubah dengan sangat cepat)
    const flashEffects = [
      'invert(100%) hue-rotate(90deg) saturate(400%)',
      'invert(100%) hue-rotate(180deg) saturate(400%)',
      'invert(100%) hue-rotate(270deg) saturate(400%)',
      'contrast(300%) brightness(150%) hue-rotate(45deg)',
      'invert(100%) sepia(100%) saturate(500%) hue-rotate(310deg)'
    ];

    // Logika buka/tutup modal pengaturan
    settingsBtn.onclick = () => settingsModal.classList.remove('hidden');
    closeSettingsBtn.onclick = () => settingsModal.classList.add('hidden');
    saveSettingsBtn.onclick = () => {
      fingerConfig.t1_p1 = parseInt(document.getElementById('t1_p1').value);
      fingerConfig.t1_p2 = parseInt(document.getElementById('t1_p2').value);
      fingerConfig.t2_p1 = parseInt(document.getElementById('t2_p1').value);
      fingerConfig.t2_p2 = parseInt(document.getElementById('t2_p2').value);
      settingsModal.classList.add('hidden');
    };

    function onResults(results) {
      if (loadingIndicator.style.display !== 'none') {
        loadingIndicator.style.display = 'none';
      }

      // Ukuran disesuaikan dengan video
      const w = canvasElement.width = videoElement.videoWidth;
      const h = canvasElement.height = videoElement.videoHeight;

      // 1. Gambar video aslinya terlebih dahulu
      canvasCtx.drawImage(results.image, 0, 0, w, h);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        let framePoints = [];

        // Ambil titik sesuai konfigurasi pengguna
        if (results.multiHandLandmarks.length >= 2) {
          const hand1 = results.multiHandLandmarks[0];
          const hand2 = results.multiHandLandmarks[1];

          framePoints = [
            { x: hand1[fingerConfig.t1_p1].x * w, y: hand1[fingerConfig.t1_p1].y * h },
            { x: hand1[fingerConfig.t1_p2].x * w, y: hand1[fingerConfig.t1_p2].y * h },
            { x: hand2[fingerConfig.t2_p1].x * w, y: hand2[fingerConfig.t2_p1].y * h },
            { x: hand2[fingerConfig.t2_p2].x * w, y: hand2[fingerConfig.t2_p2].y * h }
          ];
        } else if (results.multiHandLandmarks.length === 1) {
          // Jika hanya 1 tangan, gambar segitiga pakai 3 jari agar tetap ada efeknya
          const hand = results.multiHandLandmarks[0];
          framePoints = [
            { x: hand[fingerConfig.t1_p1].x * w, y: hand[fingerConfig.t1_p1].y * h },
            { x: hand[fingerConfig.t1_p2].x * w, y: hand[fingerConfig.t1_p2].y * h },
            { x: hand[20].x * w, y: hand[20].y * h } // Jari kelingking sbg titik ke 3
          ];
        }

        if (framePoints.length > 0) {
          canvasCtx.save();
          
          // Buat jalur area filter
          canvasCtx.beginPath();
          canvasCtx.moveTo(framePoints[0].x, framePoints[0].y);
          for (let i = 1; i < framePoints.length; i++) {
            canvasCtx.lineTo(framePoints[i].x, framePoints[i].y);
          }
          canvasCtx.closePath();

          // Potong area
          canvasCtx.clip();

          // Hitung index efek berdasarkan waktu saat ini (ganti warna setiap 60 milidetik!)
          const time = Date.now();
          const effectIndex = Math.floor(time / 60) % flashEffects.length;
          
          // Terapkan efek kedip (flash warning)
          canvasCtx.filter = flashEffects[effectIndex];
          canvasCtx.drawImage(results.image, 0, 0, w, h);
          
          // Reset clip dan filter
          canvasCtx.restore();

          // Gambar border di sekeliling area potong
          canvasCtx.beginPath();
          canvasCtx.moveTo(framePoints[0].x, framePoints[0].y);
          for (let i = 1; i < framePoints.length; i++) {
            canvasCtx.lineTo(framePoints[i].x, framePoints[i].y);
          }
          canvasCtx.closePath();

          // Efek border RGB yang ikut berkedip
          const borderColors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'];
          canvasCtx.lineWidth = 5;
          canvasCtx.strokeStyle = borderColors[Math.floor(time / 80) % borderColors.length];
          canvasCtx.stroke();
        }
      }
    }

    // AI Initialization
    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });

    // PENGATURAN PERFORMA TINGGI UNTUK HP
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0, // "0" Sangat ringan & cepat (FPS naik drastis), walau sedikit kurang akurat dari "1"
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    // Camera Initialization
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      // PENGATURAN RESOLUSI DITURUNKAN AGAR TIDAK PATAH-PATAH DI HP
      width: 640,  
      height: 480, 
      facingMode: "user"
    });

    camera.start().catch(err => {
      console.error("Camera error:", err);
      loadingIndicator.innerHTML = "❌ Kamera Diblokir.<br>Buka link ini di tab browser baru (bukan Iframe)!";
      loadingIndicator.classList.replace("border-yellow-600", "border-red-600");
      loadingIndicator.classList.replace("text-yellow-400", "text-red-400");
      loadingIndicator.classList.remove("animate-pulse");
    });
  </script>
</body>
</html>
